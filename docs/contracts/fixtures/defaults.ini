; settings.ini v1 defaults (docs/contracts/settings-v1.md)
[meta]
version = 1

[general]
; launcher (and in-game dialog) language: es | en
language = es

[paths]
; PSPRECOMP_DISC0
disc0 = disc0
; PSPRECOMP_SAVEDATA
savedata = savedata

[display]
; PSPRECOMP_FULLSCREEN=1 when true (borderless desktop)
fullscreen = true
; PSPRECOMP_WINDOW_MODE: windowed | borderless | fullscreen (absent: fullscreen decides)
window_mode = fullscreen
; PSPRECOMP_WINDOW_SCALE, 1..8
window_scale = 2
; PSPRECOMP_RENDER_SCALE, 1..8
render_scale = 4
; PSPRECOMP_PRESENT_FILTER: linear | nearest
present_filter = linear
; PSPRECOMP_TEX_FILTER: auto | nearest | linear
texture_filter = auto
; PSPRECOMP_TEXTURES=<texture_pack> only when true
hd_textures = true
texture_pack = textures/INFN00001

; keys declared by game/game_options.json (Patapon 3 below)
[game]
; 30 | 60  -> 60 adds "60fps" to PSPRECOMP_PATCHES
fps = 30
; PSPRECOMP_P3_ANIM_SMOOTH=1|0
smooth_animation = true
; PSPRECOMP_P3_FAST_LOAD=1|0
fast_loading = true

[online]
; PSPRECOMP_ADHOC_SERVER
server = 127.0.0.1
; PSPRECOMP_ADHOC_NICK
nickname = Patapon
; PSPRECOMP_ADHOC_RELAY=1 when true
relay = false
; PSPRECOMP_ADHOC_PORT_OFFSET
port_offset = 10000
; PSPRECOMP_ADHOC_MAC_FILE
mac_file = adhoc_mac.txt

; reserved for part 4; ignored in v1
[controls]
