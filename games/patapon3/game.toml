# games/patapon3/game.toml — Patapon 3 (UCES-01421 base, "DxD Edition v1.1.4" mod).
# Start empty and add [recompile] entries only after a concrete failure.
# Code overlays (USRDIR/overlay/OL_*.bin, "MWo3") load at the window below;
# each is recompiled as a bank (recompile --bank, see games/patapon3/scripts/p3.sh).

[game]
id    = "patapon3"
title = "Patapon 3 DxD (UCES-01421)"

[overlays]
# Shared code-overlay window: OL_Azito/OL_Mission/OL_Title all load at
# 0x08ABB180; 0x08BC6480 is the end of the main PT_LOAD (largest overlay+bss).
window = ["0x08ABB180", "0x08BC6480"]

[boot]
# Retail BOOT.BIN on this disc is zero-filled; the game boots from EBOOT.BIN.
boot_path = "disc0:/PSP_GAME/SYSDIR/EBOOT.BIN"

[recompile]
# Function starts Ghidra missed (gaps between its functions). Each one was a
# runtime LOOKUP_MISS (caller 0x088042DC, an indirect-call table walk) and is
# confirmed by: preceding `jr ra/jr t9 + delay slot`, and a PPSSPP-detected
# function at the same address in efonte/patapon-re's UCES01421 symbols.
force_entries = [
    "0x088E97C4",
    "0x088F2AAC",  # follows `jr t9; nop` (tail call of the previous function)
    "0x089D691C",
    "0x089D6940",
    "0x089D6AB4",
    "0x089D6ADC",
    "0x089D70F4",
    # 0x089DC06C is jumped into mid-body (preceded by lwc1 f1/f0, no return)
    # inside efonte's z_un_089dbf6c, which Ghidra split into fragments. As a
    # standalone entry it runs as a cross-function tail jump (RECOMP_LOOKUP),
    # which keeps the MIPS register/stack state in ctx.
    "0x089DC06C",
]

# Opt-in 60 fps: PSPRECOMP_PATCHES=60fps. The community "60 FPS Patch v3"
# CWCheat for UCES-01421 (pastebin Mk3ZvhBp, 2019; _L 0x2xxxxxxx = 0x08800000 +
# offset, PPSSPP Core/CwCheat.h GetAddress), whose sites hold the same words in
# this DxD EBOOT. The game normally waits two vblanks per frame; the patch:
# - 0x0883E754: nop the `bnez v0` of the vblank wait loop in FUN_0883e674
#   (wait one vblank per frame instead of the frame interval's count);
# - 0x0883D5CC..0x0883D670: nop the two "fewer than two samples" exits of the
#   sceCtrlReadBufferPositive merge in FUN_0883d434, so a frame that read one
#   buffered sample still ORs it into the pressed-buttons word;
# - 0x088FAB68 / 0x088FADF8 (FUN_088fa9d0, unit advance `pos += speed * k`):
#   `jal 0x08800C00` with the original mul.s moved into its delay slot; the
#   cave halves the step (lui at,0x3F00; mtc1 at,f31; mul.s f0,f0,f31; jr ra;
#   add.s f0,f1,f0 = the original add) so units march at the 30 fps speed.
# The game counts pad input in frames (key repeat, held time); the patapon3
# game module paces its input update to 30 Hz while this set is on
# (runtime/hooks_main.cpp).
[[patch_sets]]
name = "60fps"
reason = "community 60 FPS Patch v3 (UCES-01421 CWCheat)"
words = [
    { address = "0x0883E754", instruction = "0x00000000" },
    { address = "0x0883D5CC", instruction = "0x00000000" },
    { address = "0x0883D5D0", instruction = "0x00000000" },
    { address = "0x0883D5DC", instruction = "0x00000000" },
    { address = "0x0883D66C", instruction = "0x00000000" },
    { address = "0x0883D670", instruction = "0x00000000" },
    { address = "0x088FADF8", instruction = "0x0E200300" },
    { address = "0x088FADFC", instruction = "0x46001002" },
    { address = "0x088FAB68", instruction = "0x0E200300" },
    { address = "0x088FAB6C", instruction = "0x46001002" },
]
[[patch_sets.caves]]
address = "0x08800C00"
instructions = ["0x3C013F00", "0x4481F800", "0x461F0002", "0x03E00008", "0x46000800"]
